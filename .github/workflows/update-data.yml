name: Update Stock Index Data

on:
  schedule:
    - cron: '3,33 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Fetch Stock Data
        run: |
          mkdir -p data
          UPDATE_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          # 创建 Python 脚本
          cat > /tmp/fetch_indices.py << 'PYEOF'
          import urllib.request
          import json
          import ssl
          import time
          import os
          from datetime import datetime
          
          # 忽略 SSL 证书
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          
          # 代理列表 (用于 Yahoo Finance)
          PROXIES = [
              lambda url: f"https://api.allorigins.win/raw?url={urllib.parse.quote(url, safe='')}",
              lambda url: f"https://corsproxy.io/?{urllib.parse.quote(url, safe='')}",
              lambda url: url,  # 直连
          ]
          
          # 新浪财经 API (中国指数专用)
          def fetch_from_sina(symbol, name, region, area, currency):
              """从新浪财经获取中国相关指数"""
              sina_map = {
                  "000001.SS": "sh000001",  # 上证指数
                  "399001.SZ": "sz399001",  # 深证成指
                  "^HSI": "hkHSI",          # 恒生指数
              }
              
              sina_code = sina_map.get(symbol)
              if not sina_code:
                  return None
              
              try:
                  url = f"https://hq.sinajs.cn/list={sina_code}"
                  req = urllib.request.Request(url, headers={
                      'Referer': 'https://finance.sina.com.cn',
                      'User-Agent': 'Mozilla/5.0'
                  })
                  
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      text = resp.read().decode('gbk')
                      values = text.split('"')[1].split(',')
                      
                      if symbol in ["000001.SS", "399001.SZ"]:
                          # 上证/深证: 名称,开盘,昨收,当前,最高,最低,...
                          curr = float(values[3])
                          prev = float(values[2])
                          change = ((curr - prev) / prev) * 100
                      else:  # ^HSI
                          # 恒生: 代码,名称,当前,昨收,最高,最低,开盘,涨跌点数,涨跌幅,...
                          curr = float(values[3])
                          change = float(values[8])
                      
                      data = {
                          "id": symbol,
                          "name": name,
                          "region": region,
                          "area": area,
                          "value": round(curr, 2),
                          "change": round(change, 2),
                          "currency": currency
                      }
                      print(f"✓ {name} = {curr:.2f} ({change:+.2f}%) [新浪]")
                      return data
              except Exception as e:
                  print(f"⚠️  {name}: 新浪API失败 - {e}")
                  return None
          
          # Yahoo Finance API (美欧日指数)
          def fetch_from_yahoo(symbol, name, region, area, currency):
              """从 Yahoo Finance 获取指数"""
              yahoo_url = f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?interval=1d&range=2d"
              
              for proxy_func in PROXIES:
                  try:
                      url = proxy_func(yahoo_url)
                      req = urllib.request.Request(url, headers={
                          'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                      })
                      with urllib.request.urlopen(req, timeout=20, context=ctx) as resp:
                          text = resp.read().decode('utf-8')
                          d = json.loads(text)
                          q = d['chart']['result'][0]['indicators']['quote'][0]
                          closes = [c for c in q['close'] if c is not None]
                          if len(closes) >= 2:
                              curr, prev = closes[-1], closes[-2]
                              change = ((curr - prev) / prev) * 100
                              data = {
                                  "id": symbol,
                                  "name": name,
                                  "region": region,
                                  "area": area,
                                  "value": round(curr, 2),
                                  "change": round(change, 2),
                                  "currency": currency
                              }
                              print(f"✓ {name} = {curr:.2f} ({change:+.2f}%) [Yahoo]")
                              return data
                  except Exception as e:
                      continue
              return None
          
          INDICES = [
              ("^GSPC", "标普500", "美国", "北美洲", "USD", "yahoo"),
              ("^DJI", "道琼斯", "美国", "北美洲", "USD", "yahoo"),
              ("^IXIC", "纳斯达克", "美国", "北美洲", "USD", "yahoo"),
              ("000001.SS", "上证指数", "中国", "亚洲", "CNY", "sina"),
              ("399001.SZ", "深证成指", "中国", "亚洲", "CNY", "sina"),
              ("^N225", "日经225", "日本", "亚洲", "JPY", "yahoo"),
              ("^HSI", "恒生指数", "香港", "亚洲", "HKD", "sina"),
              ("^FTSE", "富时100", "英国", "欧洲", "GBP", "yahoo"),
              ("^GDAXI", "德国DAX", "德国", "欧洲", "EUR", "yahoo"),
              ("^FCHI", "法国CAC40", "法国", "欧洲", "EUR", "yahoo"),
          ]
          
          results = []
          
          for symbol, name, region, area, currency, source in INDICES:
              data = None
              
              # 根据数据源选择不同的获取方式
              if source == "sina":
                  data = fetch_from_sina(symbol, name, region, area, currency)
                  # 如果新浪失败，尝试 Yahoo 作为备用
                  if not data:
                      data = fetch_from_yahoo(symbol, name, region, area, currency)
              else:  # yahoo
                  data = fetch_from_yahoo(symbol, name, region, area, currency)
              
              if data:
                  results.append(data)
              else:
                  print(f"❌ {name}: 获取失败", flush=True)
              
              time.sleep(0.5)
          
          # 输出 JSON
          # 从环境变量获取更新时间，如果没有则使用当前时间
          update_time = os.environ.get('UPDATE_TIME') or datetime.now().strftime('%Y-%m-%d %H:%M:%S')
          output = {
              "update_time": update_time,
              "indices": results
          }
          
          with open('data/indices.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          
          print(f"\n=== 数据更新完成 ===")
          print(f"成功: {len(results)} 个指数")
          print(f"失败: {len(INDICES) - len(results)} 个指数")
          PYEOF
          
          export UPDATE_TIME="$UPDATE_TIME"
          python3 /tmp/fetch_indices.py
          
          echo ""
          cat data/indices.json | head -20
      
      - name: Commit and Push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/indices.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "没有数据变化，跳过提交"
          else
            git commit -m "📊 更新股票指数数据 - $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
          fi
