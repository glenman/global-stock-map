name: Update Stock & Metals Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Stock Indices
        run: |
          mkdir -p data
          UPDATE_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          declare -a YAHOO_INDICES=(
            "^GSPC|标普500|美国|北美洲|USD"
            "^DJI|道琼斯|美国|北美洲|USD"
            "^IXIC|纳斯达克|美国|北美洲|USD"
            "^GSPTSE|多伦多综指|加拿大|北美洲|CAD"
            "^MXX|墨西哥IPC|墨西哥|北美洲|MXN"
            "^BVSP|巴西BOVESPA|巴西|南美洲|BRL"
            "^MERV|阿根廷MERVAL|阿根廷|南美洲|ARS"
            "^FTSE|富时100|英国|欧洲|GBP"
            "^GDAXI|德国DAX|德国|欧洲|EUR"
            "^FCHI|法国CAC40|法国|欧洲|EUR"
            "FTSEMIB.MI|意大利MIB|意大利|欧洲|EUR"
            "^IBEX|西班牙IBEX35|西班牙|欧洲|EUR"
            "^SSMI|瑞士SMI|瑞士|欧洲|CHF"
            "^AEX|荷兰AEX|荷兰|欧洲|EUR"
            "000001.SS|上证指数|中国|亚洲|CNY"
            "399001.SZ|深证成指|中国|亚洲|CNY"
            "000300.SS|沪深300|中国|亚洲|CNY"
            "000016.SS|上证50|中国|亚洲|CNY"
            "399006.SZ|创业板指|中国|亚洲|CNY"
            "399005.SZ|中小板指|中国|亚洲|CNY"
            "^N225|日经225|日本|亚洲|JPY"
            "^HSI|恒生指数|香港|亚洲|HKD"
            "^TWII|台湾加权|台湾|亚洲|TWD"
            "^KS11|韩国KOSPI|韩国|亚洲|KRW"
            "^NSEI|印度NIFTY50|印度|亚洲|INR"
            "^BSESN|印度SENSEX|印度|亚洲|INR"
            "^JKSE|印尼综指|印尼|亚洲|IDR"
            "^SET.BK|泰国SET|泰国|亚洲|THB"
            "^KLSE|马来西亚综指|马来西亚|亚洲|MYR"
            "^STI|新加坡海峡|新加坡|亚洲|SGD"
            "^PSEI|菲律宾综指|菲律宾|亚洲|PHP"
            "^AXJO|澳洲ASX200|澳大利亚|大洋洲|AUD"
            "^NZ50|新西兰NZX50|新西兰|大洋洲|NZD"
            "^TASI.SR|沙特TASI|沙特|中东|SAR"
            "TA125.TA|以色列TA125|以色列|中东|ILS"
            "^JN0U.JO|南非JSE|南非|非洲|ZAR"
          )
          
          printf '{"update_time":"%s","indices":[' "$UPDATE_TIME" > data/indices.json
          
          first=true
          for item in "${YAHOO_INDICES[@]}"; do
            IFS='|' read -r symbol name region area currency <<< "$item"
            url="https://api.allorigins.win/raw?url=https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=2d"
            response=$(curl -s --connect-timeout 10 --max-time 15 "$url" 2>/dev/null || true)
            if [[ -z "$response" ]] || [[ "$response" == *"error"* ]]; then
              echo "skip $name" >&2
              continue
            fi
            current=$(echo "$response" | python3 scripts/parse_yahoo.py 2>/dev/null || true)
            if [[ -z "$current" ]]; then
              echo "skip $name: parse" >&2
              continue
            fi
            value=$(echo "$current" | cut -d'|' -f1)
            change=$(echo "$current" | cut -d'|' -f2)
            if [[ "$first" == "true" ]]; then first=false; else echo "," >> data/indices.json; fi
            printf '{"id":"%s","name":"%s","region":"%s","area":"%s","value":%s,"change":%s,"currency":"%s"}' \
              "$symbol" "$name" "$region" "$area" "$value" "$change" "$currency" >> data/indices.json
            echo "ok: $name"
          done
          
          echo '],' >> data/indices.json
          echo '"count":' $(grep -c '"id"' data/indices.json) >> data/indices.json
          echo '}' >> data/indices.json

      - name: Fetch Precious Metals
        run: python3 scripts/fetch_metals.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/indices.json data/metals.json
          git diff --quiet && git diff --staged --quiet || git commit -m "data: update $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git push
