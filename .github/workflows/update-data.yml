name: Update Stock Index Data

on:
  schedule:
    - cron: '3,33 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Fetch Stock Data
        run: |
          mkdir -p data
          UPDATE_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          # 创建 Python 脚本
          cat > /tmp/fetch_indices.py << 'PYEOF'
          import urllib.request
          import json
          import ssl
          import time
          import os
          from datetime import datetime
          
          # 忽略 SSL 证书
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          
          # 代理列表
          PROXIES = [
              lambda url: f"https://api.allorigins.win/raw?url={urllib.parse.quote(url, safe='')}",
              lambda url: f"https://corsproxy.io/?{urllib.parse.quote(url, safe='')}",
              lambda url: url,  # 直连
          ]
          
          INDICES = [
              ("^GSPC", "标普500", "美国", "北美洲", "USD"),
              ("^DJI", "道琼斯", "美国", "北美洲", "USD"),
              ("^IXIC", "纳斯达克", "美国", "北美洲", "USD"),
              ("000001.SS", "上证指数", "中国", "亚洲", "CNY"),
              ("399001.SZ", "深证成指", "中国", "亚洲", "CNY"),
              ("^N225", "日经225", "日本", "亚洲", "JPY"),
              ("^HSI", "恒生指数", "香港", "亚洲", "HKD"),
              ("^FTSE", "富时100", "英国", "欧洲", "GBP"),
              ("^GDAXI", "德国DAX", "德国", "欧洲", "EUR"),
              ("^FCHI", "法国CAC40", "法国", "欧洲", "EUR"),
          ]
          
          results = []
          
          for symbol, name, region, area, currency in INDICES:
              yahoo_url = f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?interval=1d&range=2d"
              
              data = None
              for proxy_func in PROXIES:
                  try:
                      url = proxy_func(yahoo_url)
                      req = urllib.request.Request(url, headers={
                          'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                      })
                      with urllib.request.urlopen(req, timeout=20, context=ctx) as resp:
                          text = resp.read().decode('utf-8')
                          d = json.loads(text)
                          q = d['chart']['result'][0]['indicators']['quote'][0]
                          closes = [c for c in q['close'] if c is not None]
                          if len(closes) >= 2:
                              curr, prev = closes[-1], closes[-2]
                              change = ((curr - prev) / prev) * 100
                              data = {
                                  "id": symbol,
                                  "name": name,
                                  "region": region,
                                  "area": area,
                                  "value": round(curr, 2),
                                  "change": round(change, 2),
                                  "currency": currency
                              }
                              print(f"✓ {name} = {curr:.2f} ({change:+.2f}%)")
                              break
                  except Exception as e:
                      continue
              
              if data:
                  results.append(data)
              else:
                  print(f"❌ {name}: 获取失败", flush=True)
              
              time.sleep(0.5)
          
          # 输出 JSON
          # 从环境变量获取更新时间，如果没有则使用当前时间
          update_time = os.environ.get('UPDATE_TIME') or datetime.now().strftime('%Y-%m-%d %H:%M:%S')
          output = {
              "update_time": update_time,
              "indices": results
          }
          
          with open('data/indices.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          
          print(f"\n=== 数据更新完成 ===")
          print(f"成功: {len(results)} 个指数")
          print(f"失败: {len(INDICES) - len(results)} 个指数")
          PYEOF
          
          export UPDATE_TIME="$UPDATE_TIME"
          python3 /tmp/fetch_indices.py
          
          echo ""
          cat data/indices.json | head -20
      
      - name: Commit and Push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/indices.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "没有数据变化，跳过提交"
          else
            git commit -m "📊 更新股票指数数据 - $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
          fi
