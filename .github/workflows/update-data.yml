name: Update Stock Index Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Fetch Data
        run: |
          echo "Fetching data..."
          echo '{"update_time": "test", "indices": []}' > data/indices.json
      
      - name: Commit and Push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/indices.json
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 更新数据"
          git push
