name: Update Stock & Metals Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Stock Indices
        run: python3 scripts/fetch_sina_global.py

      - name: Fetch Precious Metals
        run: python3 scripts/fetch_metals.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/indices.json data/metals.json
          git diff --quiet && git diff --staged --quiet || git commit -m "data: update $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git push
