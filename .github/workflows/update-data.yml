name: Update Stock Index Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Fetch Stock Data
        env:
          YAHOO_INDICES: |
            ^GSPC|标普500|美国|北美洲|USD
            ^DJI|道琼斯|美国|北美洲|USD
            ^IXIC|纳斯达克|美国|北美洲|USD
            000001.SS|上证指数|中国|亚洲|CNY
            399001.SZ|深证成指|中国|亚洲|CNY
            ^N225|日经225|日本|亚洲|JPY
            ^HSI|恒生指数|香港|亚洲|HKD
            ^FTSE|富时100|英国|欧洲|GBP
            ^GDAXI|德国DAX|德国|欧洲|EUR
            ^FCHI|法国CAC40|法国|欧洲|EUR
        run: |
          mkdir -p data
          UPDATE_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          # 初始化JSON
          echo '{' > data/indices.json
          echo '  "update_time": "'"$UPDATE_TIME"'",' >> data/indices.json
          echo '  "indices": [' >> data/indices.json
          
          FIRST=true
          SUCCESS_COUNT=0
          FAIL_COUNT=0
          
          while IFS='|' read -r SYMBOL NAME REGION AREA CURRENCY; do
            [ -z "$SYMBOL" ] && continue
            
            # 尝试3次
            for RETRY in 1 2 3; do
              URL="https://query1.finance.yahoo.com/v8/finance/chart/${SYMBOL}?interval=1d&range=2d"
              RESPONSE=$(curl -s --max-time 20 "$URL" 2>&1)
              
              if [ -n "$RESPONSE" ] && ! echo "$RESPONSE" | grep -q "error"; then
                break
              fi
              
              [ $RETRY -lt 3 ] && sleep 2
            done
            
            if [ -z "$RESPONSE" ] || echo "$RESPONSE" | grep -q "error"; then
              echo "❌ $NAME: 获取失败" >&2
              FAIL_COUNT=$((FAIL_COUNT + 1))
              continue
            fi
            
            # 提取数据
            DATA=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              q = d['chart']['result'][0]['indicators']['quote'][0]
              closes = [c for c in q['close'] if c is not None]
              if len(closes) >= 2:
                  curr, prev = closes[-1], closes[-2]
                  change = ((curr - prev) / prev) * 100
                  print(f'{curr:.2f}|{change:.2f}')
              elif len(closes) == 1:
                  print(f'{closes[0]:.2f}|0.00')
          except Exception as e:
              print(f'ERROR: {e}', file=sys.stderr)
          " 2>&1)
            
            if [ -z "$DATA" ] || echo "$DATA" | grep -q "ERROR"; then
              echo "❌ $NAME: 解析失败" >&2
              FAIL_COUNT=$((FAIL_COUNT + 1))
              continue
            fi
            
            VALUE=$(echo "$DATA" | cut -d'|' -f1)
            CHANGE=$(echo "$DATA" | cut -d'|' -f2)
            
            if [ "$FIRST" = "true" ]; then
              FIRST=false
            else
              echo ',' >> data/indices.json
            fi
            
            cat >> data/indices.json << ENTRY
              {
                "id": "${SYMBOL}",
                "name": "${NAME}",
                "region": "${REGION}",
                "area": "${AREA}",
                "value": ${VALUE},
                "change": ${CHANGE},
                "currency": "${CURRENCY}"
              }
          ENTRY
            
            echo "✓ $NAME = $VALUE ($CHANGE%)"
            SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            
            # 避免请求过快
            sleep 1
            
          done <<< "$YAHOO_INDICES"
          
          echo '' >> data/indices.json
          echo '  ]' >> data/indices.json
          echo '}' >> data/indices.json
          
          echo ""
          echo "=== 数据更新完成 ==="
          echo "更新时间: $UPDATE_TIME"
          echo "成功: $SUCCESS_COUNT 个指数"
          echo "失败: $FAIL_COUNT 个指数"
      
      - name: Commit and Push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/indices.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "没有数据变化，跳过提交"
          else
            git commit -m "📊 更新股票指数数据 - $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
          fi
