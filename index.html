<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球股票指数</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .update-time { color: #888; font-size: 14px; }
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .stat-box {
            background: rgba(255,255,255,0.05);
            padding: 15px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-label { font-size: 12px; color: #888; margin-bottom: 5px; }
        .stat-value { font-size: 28px; font-weight: bold; }
        .stat-value.up { color: #ef4444; }
        .stat-value.down { color: #22c55e; }
        .stat-value.flat { color: #6b7280; }
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 10px 20px;
            border: 1px solid #2d2d44;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .filter-btn:hover, .filter-btn.active {
            background: rgba(255,255,255,0.15);
            border-color: #00d4ff;
        }
        .filter-btn.up.active { border-color: #ef4444; background: rgba(239,68,68,0.2); }
        .filter-btn.down.active { border-color: #22c55e; background: rgba(34,197,94,0.2); }
        .filter-btn.all.active { border-color: #00d4ff; background: rgba(0,212,255,0.2); }
        .search-box {
            text-align: center;
            margin-bottom: 25px;
        }
        .search-box input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border: 1px solid #2d2d44;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .search-box input:focus { border-color: #00d4ff; }
        .search-box input::placeholder { color: #666; }
        .regions {
            max-width: 1400px;
            margin: 0 auto;
        }
        .region {
            margin-bottom: 30px;
        }
        .region-title {
            font-size: 18px;
            color: #00d4ff;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #2d2d44;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .region-title span { font-size: 24px; }
        .indices {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
        }
        .index-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid #2d2d44;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }
        .index-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .index-card.closed {
            opacity: 0.7;
        }
        .index-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .index-name { font-size: 18px; font-weight: bold; }
        .index-region { font-size: 12px; color: #888; margin-top: 3px; }
        .index-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            width: fit-content;
        }
        .index-status.open {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        .index-status.closed {
            background: rgba(107, 114, 128, 0.2);
            color: #9ca3af;
        }
        .index-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .index-status.open .index-status-dot {
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        .index-status.closed .index-status-dot {
            background: #6b7280;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .index-change {
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .index-change.up { background: rgba(239,68,68,0.2); color: #ef4444; }
        .index-change.down { background: rgba(34,197,94,0.2); color: #22c55e; }
        .index-change.flat { background: rgba(107,114,128,0.2); color: #6b7280; }
        .index-value { font-size: 28px; font-weight: bold; margin-bottom: 8px; }
        .index-currency { font-size: 12px; color: #888; }
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #2d2d44;
            color: #666;
            font-size: 12px;
        }
        .footer a { color: #00d4ff; text-decoration: none; }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2d2d44;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 600px) {
            .header h1 { font-size: 24px; }
            .stat-box { padding: 10px 20px; }
            .stat-value { font-size: 22px; }
            .indices { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌍 全球股票指数</h1>
        <div class="update-time" id="updateTime">数据更新时间: 加载中...</div>
    </div>
    
    <div class="stats">
        <div class="stat-box">
            <div class="stat-label">📈 上涨</div>
            <div class="stat-value up" id="upCount">-</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">📉 下跌</div>
            <div class="stat-value down" id="downCount">-</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">➖ 平盘</div>
            <div class="stat-value flat" id="flatCount">-</div>
        </div>
    </div>

    <div class="filter-bar">
        <button class="filter-btn all active" onclick="filter('all')">全部</button>
        <button class="filter-btn up" onclick="filter('up')">📈 上涨</button>
        <button class="filter-btn down" onclick="filter('down')">📉 下跌</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索指数名称或地区..." oninput="search()">
    </div>

    <div class="regions" id="regions">
        <div class="loading">
            <div class="loading-spinner"></div>
            <div>正在加载数据...</div>
        </div>
    </div>

    <div class="footer">
        数据来源: Yahoo Finance | 每小时自动更新 | <a href="https://github.com/glenman/global-stock-map" target="_blank">GitHub</a>
    </div>

    <script>
        const areaIcons = {
            "北美洲": "🌎",
            "南美洲": "🌎",
            "欧洲": "🌍",
            "亚洲": "🌏",
            "大洋洲": "🌏",
            "中东": "🌏",
            "非洲": "🌍"
        };

        // 交易所交易时间（北京时间，24小时制）
        // 格式: [开盘时间, 收盘时间] (多个时段用数组)
        const marketHours = {
            // 美国 (EST/EDT -> 北京时间 +12/+13)
            "美国": { 
                summer: [[21, 30], [4, 0]],   // 夏令时: 21:30-04:00
                winter: [[22, 30], [5, 0]],   // 冬令时: 22:30-05:00
                summerStart: [3, 2],  // 3月第二个周日
                winterStart: [11, 1]  // 11月第一个周日
            },
            // 中国
            "中国": { sessions: [[[9, 30], [11, 30]], [[13, 0], [15, 0]]] },
            // 香港
            "香港": { sessions: [[[10, 0], [12, 30]], [[14, 30], [16, 0]]] },
            // 台湾
            "台湾": { sessions: [[[9, 0], [13, 30]]] },
            // 日本
            "日本": { sessions: [[[8, 0], [10, 30]], [[11, 30], [14, 0]]] },
            // 韩国
            "韩国": { sessions: [[[8, 0], [14, 30]]] },
            // 印度
            "印度": { sessions: [[[11, 45], [18, 45]]] },
            // 新加坡
            "新加坡": { sessions: [[[9, 0], [17, 0]]] },
            // 马来西亚
            "马来西亚": { sessions: [[[9, 0], [17, 0]]] },
            // 泰国
            "泰国": { sessions: [[[10, 0], [12, 30]], [[14, 30], [16, 30]]] },
            // 印尼
            "印尼": { sessions: [[[10, 0], [17, 0]]] },
            // 菲律宾
            "菲律宾": { sessions: [[[9, 30], [15, 30]]] },
            // 英国 (GMT/BST -> 北京时间 +8/+9)
            "英国": { 
                summer: [[15, 0], [23, 30]],
                winter: [[16, 0], [0, 30]],
                summerStart: [3, -1],  // 3月最后一个周日
                winterStart: [10, -1]  // 10月最后一个周日
            },
            // 德国/法国/意大利/西班牙/荷兰/瑞士 (CET/CEST)
            "德国": { 
                summer: [[15, 0], [23, 30]],
                winter: [[16, 0], [0, 30]],
                summerStart: [3, -1],
                winterStart: [10, -1]
            },
            "法国": { 
                summer: [[15, 0], [23, 30]],
                winter: [[16, 0], [0, 30]],
                summerStart: [3, -1],
                winterStart: [10, -1]
            },
            "意大利": { 
                summer: [[15, 0], [23, 30]],
                winter: [[16, 0], [0, 30]],
                summerStart: [3, -1],
                winterStart: [10, -1]
            },
            "西班牙": { 
                summer: [[15, 0], [23, 30]],
                winter: [[16, 0], [0, 30]],
                summerStart: [3, -1],
                winterStart: [10, -1]
            },
            "荷兰": { 
                summer: [[15, 0], [23, 30]],
                winter: [[16, 0], [0, 30]],
                summerStart: [3, -1],
                winterStart: [10, -1]
            },
            "瑞士": { 
                summer: [[15, 0], [23, 30]],
                winter: [[16, 0], [0, 30]],
                summerStart: [3, -1],
                winterStart: [10, -1]
            },
            // 加拿大
            "加拿大": { 
                summer: [[21, 30], [4, 0]],
                winter: [[22, 30], [5, 0]],
                summerStart: [3, 2],
                winterStart: [11, 1]
            },
            // 墨西哥
            "墨西哥": { 
                summer: [[21, 30], [4, 0]],
                winter: [[22, 30], [5, 0]],
                summerStart: [3, 2],
                winterStart: [11, 1]
            },
            // 巴西
            "巴西": { sessions: [[[21, 0], [4, 0]]] },
            // 阿根廷
            "阿根廷": { sessions: [[[22, 0], [5, 0]]] },
            // 澳大利亚
            "澳大利亚": { sessions: [[[7, 0], [13, 0]]] },
            // 新西兰
            "新西兰": { sessions: [[[5, 0], [11, 0]]] },
            // 沙特
            "沙特": { sessions: [[[13, 0], [21, 0]]] },
            // 以色列
            "以色列": { sessions: [[[14, 0], [22, 30]]] },
            // 南非
            "南非": { sessions: [[[15, 0], [23, 0]]] },
            // 埃及
            "埃及": { sessions: [[[15, 0], [23, 0]]] }
        };

        // 判断是否夏令时
        function isSummerTime(region, now) {
            const config = marketHours[region];
            if (!config || !config.summerStart) return false;
            
            const year = now.getFullYear();
            const [month, week] = config.summerStart;
            
            // 简化判断：5-10月为夏令时（北半球），其他为冬令时
            const currentMonth = now.getMonth() + 1;
            return currentMonth >= 4 && currentMonth <= 10;
        }

        // 判断市场是否开盘
        function isMarketOpen(region) {
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentTime = currentHour * 60 + currentMinute;
            
            const config = marketHours[region];
            if (!config) return false;
            
            // 有多个交易时段
            if (config.sessions) {
                for (const session of config.sessions) {
                    const [[startH, startM], [endH, endM]] = session;
                    const startTime = startH * 60 + startM;
                    const endTime = endH * 60 + endM;
                    
                    // 处理跨天情况
                    if (endTime < startTime) {
                        if (currentTime >= startTime || currentTime < endTime) {
                            return true;
                        }
                    } else {
                        if (currentTime >= startTime && currentTime < endTime) {
                            return true;
                        }
                    }
                }
                return false;
            }
            
            // 有夏令时/冬令时区分
            if (config.summer && config.winter) {
                const isSummer = isSummerTime(region, now);
                const hours = isSummer ? config.summer : config.winter;
                const [[startH, startM], [endH, endM]] = hours;
                const startTime = startH * 60 + startM;
                const endTime = endH * 60 + endM;
                
                if (endTime < startTime) {
                    return currentTime >= startTime || currentTime < endTime;
                } else {
                    return currentTime >= startTime && currentTime < endTime;
                }
            }
            
            return false;
        }

        let indexData = [];
        let currentFilter = 'all';
        let searchTerm = '';

        async function loadData() {
            try {
                const response = await fetch('data/indices.json');
                if (!response.ok) throw new Error('Failed to load data');
                const data = await response.json();
                indexData = data.indices || [];
                document.getElementById('updateTime').textContent = `数据更新时间: ${data.update_time || '未知'}`;
                updateStats();
                render();
            } catch (e) {
                console.error('Load error:', e);
                document.getElementById('regions').innerHTML = `
                    <div class="loading">
                        <div style="color: #ef4444;">❌ 数据加载失败</div>
                        <div style="margin-top: 10px; font-size: 12px;">请稍后刷新页面重试</div>
                    </div>
                `;
            }
        }

        function updateStats() {
            document.getElementById('upCount').textContent = indexData.filter(i => i.change > 0.01).length;
            document.getElementById('downCount').textContent = indexData.filter(i => i.change < -0.01).length;
            document.getElementById('flatCount').textContent = indexData.filter(i => Math.abs(i.change) <= 0.01).length;
        }

        function getFilteredIndices() {
            return indexData.filter(i => {
                const matchFilter = currentFilter === 'all' || 
                    (currentFilter === 'up' && i.change > 0.01) ||
                    (currentFilter === 'down' && i.change < -0.01);
                const matchSearch = !searchTerm || 
                    i.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    i.region.toLowerCase().includes(searchTerm.toLowerCase());
                return matchFilter && matchSearch;
            });
        }

        function render() {
            const indices = getFilteredIndices();
            const regions = document.getElementById('regions');
            
            if (indices.length === 0) {
                regions.innerHTML = '<div class="loading"><div>没有符合条件的指数</div></div>';
                return;
            }

            const groups = {};
            indices.forEach(i => {
                if (!groups[i.area]) groups[i.area] = [];
                groups[i.area].push(i);
            });

            Object.keys(groups).forEach(area => {
                groups[area].sort((a, b) => b.change - a.change);
            });

            const areaOrder = ["北美洲", "南美洲", "欧洲", "亚洲", "大洋洲", "中东", "非洲"];
            
            let html = '';
            areaOrder.forEach(area => {
                if (!groups[area] || groups[area].length === 0) return;
                
                html += `<div class="region">
                    <div class="region-title"><span>${areaIcons[area] || '🌐'}</span> ${area}</div>
                    <div class="indices">`;
                
                groups[area].forEach(i => {
                    const changeClass = i.change > 0.01 ? 'up' : (i.change < -0.01 ? 'down' : 'flat');
                    const changeStr = i.change > 0 ? `+${i.change.toFixed(2)}%` : 
                                      (i.change < 0 ? `${i.change.toFixed(2)}%` : '0.00%');
                    
                    const isOpen = isMarketOpen(i.region);
                    const statusClass = isOpen ? 'open' : 'closed';
                    const statusText = isOpen ? '🟢 交易中' : '⚫ 已收盘';
                    const cardClass = isOpen ? '' : 'closed';
                    
                    html += `<div class="index-card ${cardClass}">
                        <div class="index-status ${statusClass}">
                            <span class="index-status-dot"></span>
                            ${statusText}
                        </div>
                        <div class="index-header">
                            <div>
                                <div class="index-name">${i.name}</div>
                                <div class="index-region">📍 ${i.region}</div>
                            </div>
                            <div class="index-change ${changeClass}">${changeStr}</div>
                        </div>
                        <div class="index-value">${i.value.toLocaleString(undefined, {maximumFractionDigits: 2})}</div>
                        <div class="index-currency">货币: ${i.currency}</div>
                    </div>`;
                });
                
                html += `</div></div>`;
            });

            regions.innerHTML = html;
        }

        function filter(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.filter-btn.${type}`).classList.add('active');
            render();
        }

        function search() {
            searchTerm = document.getElementById('searchInput').value;
            render();
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
