<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球股票指数地图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
        }
        .header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
            border-bottom: 1px solid #2d2d44;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .update-time {
            color: #888;
            font-size: 14px;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px;
            background: #16213e;
            border-bottom: 1px solid #2d2d44;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .legend-dot.up { background: #ef4444; }
        .legend-dot.down { background: #22c55e; }
        .legend-dot.flat { background: #6b7280; }
        #map {
            width: 100%;
            height: calc(100vh - 140px);
            min-height: 500px;
        }
        .stats-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 20px;
            background: rgba(22, 33, 62, 0.95);
            border-top: 1px solid #2d2d44;
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 14px;
        }
        .stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-value {
            font-weight: bold;
        }
        .stat-value.up { color: #ef4444; }
        .stat-value.down { color: #22c55e; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌍 全球股票指数地图</h1>
        <div class="update-time" id="updateTime">数据更新时间: 加载中...</div>
    </div>
    <div class="legend">
        <div class="legend-item">
            <span class="legend-dot up"></span>
            <span>上涨</span>
        </div>
        <div class="legend-item">
            <span class="legend-dot down"></span>
            <span>下跌</span>
        </div>
        <div class="legend-item">
            <span class="legend-dot flat"></span>
            <span>平盘</span>
        </div>
    </div>
    <div id="map"></div>
    <div class="stats-bar">
        <div class="stat">
            <span>📈 上涨:</span>
            <span class="stat-value up" id="upCount">-</span>
        </div>
        <div class="stat">
            <span>📉 下跌:</span>
            <span class="stat-value down" id="downCount">-</span>
        </div>
        <div class="stat">
            <span>➖ 平盘:</span>
            <span class="stat-value" id="flatCount">-</span>
        </div>
    </div>

    <script>
        // ========== 股指数据 ==========
        const stockData = {
            "update_time": "2026-03-23 15:30:00",
            "indices": [
                // 北美洲
                {"id":"sp500","name":"标普500","region":"美国","lat":40.7128,"lng":-74.0060,"value":5230.15,"change":0.85,"currency":"USD"},
                {"id":"nasdaq","name":"纳斯达克","region":"美国","lat":37.7749,"lng":-122.4194,"value":16428.82,"change":1.25,"currency":"USD"},
                {"id":"dow","name":"道琼斯","region":"美国","lat":41.8781,"lng":-87.6298,"value":39512.84,"change":0.45,"currency":"USD"},
                {"id":"tsx","name":"多伦多综指","region":"加拿大","lat":43.6532,"lng":-79.3832,"value":22150.30,"change":-0.15,"currency":"CAD"},
                {"id":"mexbol","name":"墨西哥IPC","region":"墨西哥","lat":19.4326,"lng":-99.1332,"value":58230.50,"change":0.32,"currency":"MXN"},
                
                // 南美洲
                {"id":"bovespa","name":"巴西BOVESPA","region":"巴西","lat":-23.5505,"lng":-46.6333,"value":128500.20,"change":-0.78,"currency":"BRL"},
                {"id":"merval","name":"阿根廷MERVAL","region":"阿根廷","lat":-34.6037,"lng":-58.3816,"value":1125800.00,"change":2.15,"currency":"ARS"},
                
                // 欧洲
                {"id":"ftse100","name":"富时100","region":"英国","lat":51.5074,"lng":-0.1278,"value":7780.30,"change":-0.50,"currency":"GBP"},
                {"id":"dax","name":"德国DAX","region":"德国","lat":52.5200,"lng":13.4050,"value":18920.10,"change":0.65,"currency":"EUR"},
                {"id":"cac40","name":"法国CAC40","region":"法国","lat":48.8566,"lng":2.3522,"value":8150.40,"change":0.42,"currency":"EUR"},
                {"id":"ftsemib","name":"意大利MIB","region":"意大利","lat":45.4642,"lng":9.1900,"value":38520.80,"change":-0.28,"currency":"EUR"},
                {"id":"ibex35","name":"西班牙IBEX35","region":"西班牙","lat":40.4168,"lng":-3.7038,"value":11280.50,"change":0.18,"currency":"EUR"},
                {"id":"smi","name":"瑞士SMI","region":"瑞士","lat":47.3769,"lng":8.5417,"value":11850.30,"change":0.35,"currency":"CHF"},
                {"id":"aex","name":"荷兰AEX","region":"荷兰","lat":52.3676,"lng":4.9041,"value":825.60,"change":-0.12,"currency":"EUR"},
                
                // 亚洲
                {"id":"nikkei225","name":"日经225","region":"日本","lat":35.6762,"lng":139.6503,"value":38950.20,"change":-0.32,"currency":"JPY"},
                {"id":"topix","name":"东证TOPIX","region":"日本","lat":35.6895,"lng":139.6917,"value":2725.50,"change":-0.25,"currency":"JPY"},
                {"id":"hs300","name":"沪深300","region":"中国","lat":39.9042,"lng":116.4074,"value":3850.50,"change":0.25,"currency":"CNY"},
                {"id":"sse","name":"上证指数","region":"中国","lat":31.2304,"lng":121.4737,"value":3085.20,"change":0.18,"currency":"CNY"},
                {"id":"szse","name":"深证成指","region":"中国","lat":22.5431,"lng":114.0579,"value":9580.30,"change":0.35,"currency":"CNY"},
                {"id":"hsi","name":"恒生指数","region":"香港","lat":22.3193,"lng":114.1694,"value":17250.80,"change":-0.85,"currency":"HKD"},
                {"id":"twse","name":"台湾加权","region":"台湾","lat":25.0330,"lng":121.5654,"value":20150.40,"change":0.68,"currency":"TWD"},
                {"id":"kospi","name":"韩国KOSPI","region":"韩国","lat":37.5665,"lng":126.9780,"value":2750.30,"change":0.45,"currency":"KRW"},
                {"id":"kosdaq","name":"韩国KOSDAQ","region":"韩国","lat":37.5125,"lng":127.0675,"value":875.20,"change":1.12,"currency":"KRW"},
                {"id":"nifty50","name":"印度NIFTY50","region":"印度","lat":28.6139,"lng":77.2090,"value":22450.80,"change":0.92,"currency":"INR"},
                {"id":"bse","name":"印度SENSEX","region":"印度","lat":19.0760,"lng":72.8777,"value":73850.50,"change":0.88,"currency":"INR"},
                {"id":"jakarta","name":"印尼综指","region":"印尼","lat":-6.2088,"lng":106.8456,"value":7280.50,"change":-0.42,"currency":"IDR"},
                {"id":"set","name":"泰国SET","region":"泰国","lat":13.7563,"lng":100.5018,"value":1385.20,"change":0.15,"currency":"THB"},
                {"id":"fklci","name":"马来西亚综指","region":"马来西亚","lat":3.1390,"lng":101.6869,"value":1585.30,"change":-0.22,"currency":"MYR"},
                {"id":"sti","name":"新加坡海峡","region":"新加坡","lat":1.3521,"lng":103.8198,"value":3250.80,"change":0.28,"currency":"SGD"},
                {"id":"psei","name":"菲律宾综指","region":"菲律宾","lat":14.5995,"lng":120.9842,"value":6850.40,"change":-0.55,"currency":"PHP"},
                
                // 大洋洲
                {"id":"asx200","name":"澳洲ASX200","region":"澳大利亚","lat":-33.8688,"lng":151.2093,"value":7850.30,"change":0.38,"currency":"AUD"},
                {"id":"nzx50","name":"新西兰NZX50","region":"新西兰","lat":-36.8485,"lng":174.7633,"value":12250.80,"change":0.22,"currency":"NZD"},
                
                // 中东
                {"id":"tadawul","name":"沙特TASI","region":"沙特","lat":24.7136,"lng":46.6753,"value":12250.50,"change":-0.35,"currency":"SAR"},
                {"id":"tase","name":"以色列TA125","region":"以色列","lat":32.0853,"lng":34.7818,"value":1850.30,"change":0.48,"currency":"ILS"},
                {"id":"dfm","name":"迪拜DFM","region":"阿联酋","lat":25.2048,"lng":55.2708,"value":4125.80,"change":0.65,"currency":"AED"},
                
                // 非洲
                {"id":"jse","name":"南非JSE","region":"南非","lat":-26.2041,"lng":28.0473,"value":78520.50,"change":-0.68,"currency":"ZAR"},
                {"id":"egx30","name":"埃及EGX30","region":"埃及","lat":30.0444,"lng":31.2357,"value":28500.30,"change":1.25,"currency":"EGP"}
            ]
        };

        // ========== 统计数据 ==========
        function updateStats() {
            const indices = stockData.indices;
            const up = indices.filter(i => i.change > 0).length;
            const down = indices.filter(i => i.change < 0).length;
            const flat = indices.filter(i => i.change === 0).length;
            
            document.getElementById('upCount').textContent = up;
            document.getElementById('downCount').textContent = down;
            document.getElementById('flatCount').textContent = flat;
            document.getElementById('updateTime').textContent = `数据更新时间: ${stockData.update_time}`;
        }

        // ========== ECharts 配置 ==========
        function initMap() {
            const chart = echarts.init(document.getElementById('map'));
            
            // 转换数据格式
            const data = stockData.indices.map(item => ({
                name: item.name,
                value: [item.lng, item.lat, item.value, item.change, item.currency, item.region],
                itemStyle: {
                    color: item.change > 0 ? '#ef4444' : (item.change < 0 ? '#22c55e' : '#6b7280')
                }
            }));

            const option = {
                backgroundColor: '#1a1a2e',
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(22, 33, 62, 0.95)',
                    borderColor: '#2d2d44',
                    borderWidth: 1,
                    textStyle: {
                        color: '#fff'
                    },
                    formatter: function(params) {
                        if (params.seriesType === 'scatter') {
                            const [lng, lat, value, change, currency, region] = params.data.value;
                            const changeStr = change > 0 ? `+${change.toFixed(2)}%` : 
                                              (change < 0 ? `${change.toFixed(2)}%` : '0.00%');
                            const changeColor = change > 0 ? '#ef4444' : (change < 0 ? '#22c55e' : '#6b7280');
                            const arrow = change > 0 ? '📈' : (change < 0 ? '📉' : '➖');
                            
                            return `
                                <div style="padding: 8px; min-width: 200px;">
                                    <div style="font-size: 16px; font-weight: bold; margin-bottom: 8px;">
                                        ${params.data.name}
                                    </div>
                                    <div style="color: #888; font-size: 12px; margin-bottom: 10px;">
                                        📍 ${region}
                                    </div>
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                        <span>当前值:</span>
                                        <span style="font-weight: bold;">${value.toLocaleString()}</span>
                                    </div>
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                        <span>涨跌幅:</span>
                                        <span style="color: ${changeColor}; font-weight: bold;">
                                            ${arrow} ${changeStr}
                                        </span>
                                    </div>
                                    <div style="display: flex; justify-content: space-between;">
                                        <span>货币:</span>
                                        <span>${currency}</span>
                                    </div>
                                </div>
                            `;
                        }
                        return params.name;
                    }
                },
                geo: {
                    map: 'world',
                    roam: true,
                    zoom: 1.2,
                    center: [10, 20],
                    scaleLimit: {
                        min: 1,
                        max: 8
                    },
                    label: {
                        show: false
                    },
                    emphasis: {
                        label: {
                            show: false
                        },
                        itemStyle: {
                            areaColor: '#2d2d44'
                        }
                    },
                    itemStyle: {
                        areaColor: '#16213e',
                        borderColor: '#2d2d44',
                        borderWidth: 0.5
                    }
                },
                series: [{
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    data: data,
                    symbolSize: 14,
                    symbol: 'circle',
                    emphasis: {
                        scale: 1.5,
                        itemStyle: {
                            shadowBlur: 10,
                            shadowColor: 'rgba(255, 255, 255, 0.5)'
                        }
                    },
                    zlevel: 10
                }]
            };

            // 加载世界地图
            fetch('https://cdn.jsdelivr.net/npm/echarts@5.5.0/map/json/world.json')
                .then(response => response.json())
                .then(worldJson => {
                    echarts.registerMap('world', worldJson);
                    chart.setOption(option);
                })
                .catch(error => {
                    console.error('加载地图失败:', error);
                    // 备用CDN
                    fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json')
                        .then(response => response.json())
                        .then(chinaJson => {
                            echarts.registerMap('world', chinaJson);
                            chart.setOption(option);
                        });
                });

            // 响应式
            window.addEventListener('resize', () => {
                chart.resize();
            });
        }

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', () => {
            updateStats();
            initMap();
        });
    </script>
</body>
</html>
