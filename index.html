<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球股票指数</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .update-time { color: #888; font-size: 14px; }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
            gap: 20px;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #2d2d44;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #888; }
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .stat-box {
            background: rgba(255,255,255,0.05);
            padding: 15px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-label { font-size: 12px; color: #888; margin-bottom: 5px; }
        .stat-value { font-size: 28px; font-weight: bold; }
        .stat-value.up { color: #ef4444; }
        .stat-value.down { color: #22c55e; }
        .stat-value.flat { color: #6b7280; }
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 10px 20px;
            border: 1px solid #2d2d44;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .filter-btn:hover, .filter-btn.active {
            background: rgba(255,255,255,0.15);
            border-color: #00d4ff;
        }
        .filter-btn.up.active { border-color: #ef4444; background: rgba(239,68,68,0.2); }
        .filter-btn.down.active { border-color: #22c55e; background: rgba(34,197,94,0.2); }
        .filter-btn.all.active { border-color: #00d4ff; background: rgba(0,212,255,0.2); }
        .search-box {
            text-align: center;
            margin-bottom: 25px;
        }
        .search-box input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border: 1px solid #2d2d44;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .search-box input:focus { border-color: #00d4ff; }
        .search-box input::placeholder { color: #666; }
        .refresh-btn {
            display: block;
            margin: 0 auto 20px;
            padding: 10px 30px;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }
        .refresh-btn:hover { transform: scale(1.05); }
        .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .regions {
            max-width: 1400px;
            margin: 0 auto;
        }
        .region {
            margin-bottom: 30px;
        }
        .region-title {
            font-size: 18px;
            color: #00d4ff;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #2d2d44;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .region-title span { font-size: 24px; }
        .indices {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
        }
        .index-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid #2d2d44;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }
        .index-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .index-card.error {
            border-color: #ef4444;
            opacity: 0.6;
        }
        .index-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .index-name { font-size: 18px; font-weight: bold; }
        .index-region { font-size: 12px; color: #888; margin-top: 3px; }
        .index-change {
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .index-change.up { background: rgba(239,68,68,0.2); color: #ef4444; }
        .index-change.down { background: rgba(34,197,94,0.2); color: #22c55e; }
        .index-change.flat { background: rgba(107,114,128,0.2); color: #6b7280; }
        .index-value { font-size: 28px; font-weight: bold; margin-bottom: 8px; }
        .index-currency { font-size: 12px; color: #888; }
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #2d2d44;
            color: #666;
            font-size: 12px;
        }
        .footer a { color: #00d4ff; text-decoration: none; }
        .error-msg {
            text-align: center;
            color: #ef4444;
            padding: 20px;
            background: rgba(239,68,68,0.1);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        @media (max-width: 600px) {
            .header h1 { font-size: 24px; }
            .stat-box { padding: 10px 20px; }
            .stat-value { font-size: 22px; }
            .indices { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在获取全球股票指数数据...</div>
    </div>

    <div class="header">
        <h1>🌍 全球股票指数</h1>
        <div class="update-time" id="updateTime">数据更新时间: 加载中...</div>
    </div>
    
    <div class="stats">
        <div class="stat-box">
            <div class="stat-label">📈 上涨</div>
            <div class="stat-value up" id="upCount">-</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">📉 下跌</div>
            <div class="stat-value down" id="downCount">-</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">➖ 平盘</div>
            <div class="stat-value flat" id="flatCount">-</div>
        </div>
    </div>

    <button class="refresh-btn" id="refreshBtn" onclick="loadAllData()">🔄 刷新数据</button>

    <div class="filter-bar">
        <button class="filter-btn all active" onclick="filter('all')">全部</button>
        <button class="filter-btn up" onclick="filter('up')">📈 上涨</button>
        <button class="filter-btn down" onclick="filter('down')">📉 下跌</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索指数名称或地区..." oninput="search()">
    </div>

    <div class="regions" id="regions"></div>

    <div class="footer">
        数据来源: Yahoo Finance | <a href="https://github.com/glenman/global-stock-map" target="_blank">GitHub</a>
    </div>

    <script>
        // 指数配置 - Yahoo Finance符号
        const indexConfig = [
            // 北美洲
            { symbol: "^GSPC", name: "标普500", region: "美国", area: "北美洲", currency: "USD" },
            { symbol: "^DJI", name: "道琼斯", region: "美国", area: "北美洲", currency: "USD" },
            { symbol: "^IXIC", name: "纳斯达克", region: "美国", area: "北美洲", currency: "USD" },
            { symbol: "^GSPTSE", name: "多伦多综指", region: "加拿大", area: "北美洲", currency: "CAD" },
            { symbol: "^MXX", name: "墨西哥IPC", region: "墨西哥", area: "北美洲", currency: "MXN" },
            
            // 南美洲
            { symbol: "^BVSP", name: "巴西BOVESPA", region: "巴西", area: "南美洲", currency: "BRL" },
            { symbol: "^MERV", name: "阿根廷MERVAL", region: "阿根廷", area: "南美洲", currency: "ARS" },
            
            // 欧洲
            { symbol: "^FTSE", name: "富时100", region: "英国", area: "欧洲", currency: "GBP" },
            { symbol: "^GDAXI", name: "德国DAX", region: "德国", area: "欧洲", currency: "EUR" },
            { symbol: "^FCHI", name: "法国CAC40", region: "法国", area: "欧洲", currency: "EUR" },
            { symbol: "FTSEMIB.MI", name: "意大利MIB", region: "意大利", area: "欧洲", currency: "EUR" },
            { symbol: "^IBEX", name: "西班牙IBEX35", region: "西班牙", area: "欧洲", currency: "EUR" },
            { symbol: "^SSMI", name: "瑞士SMI", region: "瑞士", area: "欧洲", currency: "CHF" },
            { symbol: "^AEX", name: "荷兰AEX", region: "荷兰", area: "欧洲", currency: "EUR" },
            
            // 亚洲
            { symbol: "^N225", name: "日经225", region: "日本", area: "亚洲", currency: "JPY" },
            { symbol: "^TOPIX", name: "东证TOPIX", region: "日本", area: "亚洲", currency: "JPY" },
            { symbol: "000300.SS", name: "沪深300", region: "中国", area: "亚洲", currency: "CNY" },
            { symbol: "000001.SS", name: "上证指数", region: "中国", area: "亚洲", currency: "CNY" },
            { symbol: "399001.SZ", name: "深证成指", region: "中国", area: "亚洲", currency: "CNY" },
            { symbol: "^HSI", name: "恒生指数", region: "香港", area: "亚洲", currency: "HKD" },
            { symbol: "^TWII", name: "台湾加权", region: "台湾", area: "亚洲", currency: "TWD" },
            { symbol: "^KS11", name: "韩国KOSPI", region: "韩国", area: "亚洲", currency: "KRW" },
            { symbol: "^NSEI", name: "印度NIFTY50", region: "印度", area: "亚洲", currency: "INR" },
            { symbol: "^BSESN", name: "印度SENSEX", region: "印度", area: "亚洲", currency: "INR" },
            { symbol: "^JKSE", name: "印尼综指", region: "印尼", area: "亚洲", currency: "IDR" },
            { symbol: "^SET.BK", name: "泰国SET", region: "泰国", area: "亚洲", currency: "THB" },
            { symbol: "^KLSE", name: "马来西亚综指", region: "马来西亚", area: "亚洲", currency: "MYR" },
            { symbol: "^STI", name: "新加坡海峡", region: "新加坡", area: "亚洲", currency: "SGD" },
            { symbol: "^PSEI", name: "菲律宾综指", region: "菲律宾", area: "亚洲", currency: "PHP" },
            
            // 大洋洲
            { symbol: "^AXJO", name: "澳洲ASX200", region: "澳大利亚", area: "大洋洲", currency: "AUD" },
            { symbol: "^NZ50", name: "新西兰NZX50", region: "新西兰", area: "大洋洲", currency: "NZD" },
            
            // 中东
            { symbol: "^TASI.SR", name: "沙特TASI", region: "沙特", area: "中东", currency: "SAR" },
            { symbol: "^TA125.TA", name: "以色列TA125", region: "以色列", area: "中东", currency: "ILS" },
            
            // 非洲
            { symbol: "^JN0U.JO", name: "南非JSE", region: "南非", area: "非洲", currency: "ZAR" },
            { symbol: "^EGX30", name: "埃及EGX30", region: "埃及", area: "非洲", currency: "EGP" }
        ];

        const areaIcons = {
            "北美洲": "🌎",
            "南美洲": "🌎",
            "欧洲": "🌍",
            "亚洲": "🌏",
            "大洋洲": "🌏",
            "中东": "🌏",
            "非洲": "🌍"
        };

        let indexData = [];
        let currentFilter = 'all';
        let searchTerm = '';
        let isLoading = false;

        // 通过CORS代理获取Yahoo Finance数据
        async function fetchIndexData(symbol) {
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=2d`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            
            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                
                if (data.chart && data.chart.result && data.chart.result[0]) {
                    const result = data.chart.result[0];
                    const meta = result.meta;
                    const quotes = result.indicators?.quote?.[0];
                    
                    if (quotes && quotes.close) {
                        const closes = quotes.close.filter(c => c !== null);
                        const currentPrice = closes[closes.length - 1];
                        const prevPrice = closes.length > 1 ? closes[closes.length - 2] : currentPrice;
                        const change = prevPrice > 0 ? ((currentPrice - prevPrice) / prevPrice) * 100 : 0;
                        
                        return {
                            value: currentPrice,
                            change: change,
                            currency: meta.currency || 'USD'
                        };
                    }
                }
                return null;
            } catch (e) {
                console.error(`Failed to fetch ${symbol}:`, e);
                return null;
            }
        }

        // 加载所有数据
        async function loadAllData() {
            if (isLoading) return;
            isLoading = true;
            
            const refreshBtn = document.getElementById('refreshBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');
            refreshBtn.disabled = true;
            refreshBtn.textContent = '⏳ 加载中...';
            loadingOverlay.style.display = 'flex';
            
            indexData = [];
            
            // 批量获取数据，每次5个并发
            const batchSize = 5;
            for (let i = 0; i < indexConfig.length; i += batchSize) {
                const batch = indexConfig.slice(i, i + batchSize);
                const results = await Promise.all(
                    batch.map(async (config) => {
                        const data = await fetchIndexData(config.symbol);
                        return {
                            ...config,
                            ...data,
                            error: data === null
                        };
                    })
                );
                indexData.push(...results);
            }
            
            isLoading = false;
            refreshBtn.disabled = false;
            refreshBtn.textContent = '🔄 刷新数据';
            loadingOverlay.style.display = 'none';
            
            updateStats();
            render();
        }

        function updateStats() {
            const validData = indexData.filter(i => !i.error);
            document.getElementById('upCount').textContent = validData.filter(i => i.change > 0.01).length;
            document.getElementById('downCount').textContent = validData.filter(i => i.change < -0.01).length;
            document.getElementById('flatCount').textContent = validData.filter(i => Math.abs(i.change) <= 0.01).length;
            
            const now = new Date();
            document.getElementById('updateTime').textContent = `数据更新时间: ${now.toLocaleString('zh-CN', { 
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            })}`;
        }

        function getFilteredIndices() {
            return indexData.filter(i => {
                const matchFilter = currentFilter === 'all' || 
                    (currentFilter === 'up' && i.change > 0.01) ||
                    (currentFilter === 'down' && i.change < -0.01);
                const matchSearch = !searchTerm || 
                    i.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    i.region.toLowerCase().includes(searchTerm.toLowerCase());
                return matchFilter && matchSearch;
            });
        }

        function render() {
            const indices = getFilteredIndices();
            const regions = document.getElementById('regions');
            
            // 按地区分组
            const groups = {};
            indices.forEach(i => {
                if (!groups[i.area]) groups[i.area] = [];
                groups[i.area].push(i);
            });

            // 排序：先按涨跌幅，再按值
            Object.keys(groups).forEach(area => {
                groups[area].sort((a, b) => {
                    if (a.change !== b.change) return b.change - a.change;
                    return (b.value || 0) - (a.value || 0);
                });
            });

            const areaOrder = ["北美洲", "南美洲", "欧洲", "亚洲", "大洋洲", "中东", "非洲"];
            
            let html = '';
            areaOrder.forEach(area => {
                if (!groups[area] || groups[area].length === 0) return;
                
                html += `<div class="region">
                    <div class="region-title"><span>${areaIcons[area] || '🌐'}</span> ${area}</div>
                    <div class="indices">`;
                
                groups[area].forEach(i => {
                    if (i.error) {
                        html += `<div class="index-card error">
                            <div class="index-header">
                                <div>
                                    <div class="index-name">${i.name}</div>
                                    <div class="index-region">📍 ${i.region}</div>
                                </div>
                            </div>
                            <div class="index-value" style="color:#888">加载失败</div>
                        </div>`;
                        return;
                    }
                    
                    const changeClass = i.change > 0.01 ? 'up' : (i.change < -0.01 ? 'down' : 'flat');
                    const changeStr = i.change > 0 ? `+${i.change.toFixed(2)}%` : 
                                      (i.change < 0 ? `${i.change.toFixed(2)}%` : '0.00%');
                    
                    html += `<div class="index-card">
                        <div class="index-header">
                            <div>
                                <div class="index-name">${i.name}</div>
                                <div class="index-region">📍 ${i.region}</div>
                            </div>
                            <div class="index-change ${changeClass}">${changeStr}</div>
                        </div>
                        <div class="index-value">${i.value.toLocaleString(undefined, {maximumFractionDigits: 2})}</div>
                        <div class="index-currency">货币: ${i.currency}</div>
                    </div>`;
                });
                
                html += `</div></div>`;
            });

            regions.innerHTML = html || '<p style="text-align:center;color:#888;padding:40px;">没有符合条件的指数</p>';
        }

        function filter(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.filter-btn.${type}`).classList.add('active');
            render();
        }

        function search() {
            searchTerm = document.getElementById('searchInput').value;
            render();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadAllData();
        });
    </script>
</body>
</html>
